name: Test update scripts

on:
  pull_request:
    paths:
      - 'update.sh'
      - 'x-ui.sh'
      - 'install.sh'
      - 'tools/tests/update_test.sh'
      - '.github/workflows/update-script-tests.yml'
  push:
    branches: [main]
    paths:
      - 'update.sh'
      - 'x-ui.sh'
      - 'install.sh'
      - 'tools/tests/update_test.sh'
      - '.github/workflows/update-script-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        environment: [ubuntu, centos7]
    steps:
      - uses: actions/checkout@v7
      - name: Check Bash syntax
        run: |
          for script in update.sh x-ui.sh install.sh tools/tests/update_test.sh; do
            bash -n "$script"
          done
      - name: Test isolated in-place updates and rollback
        if: matrix.environment == 'ubuntu'
        run: bash tools/tests/update_test.sh
      - name: Test on CentOS 7 Bash 4.2
        if: matrix.environment == 'centos7'
        run: |
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
            quay.io/centos/centos:7 \
            bash -c 'bash --version; bash tools/tests/update_test.sh'
